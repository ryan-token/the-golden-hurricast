# Hurricast API — see README.md for the architecture and DynamoDB data model.
# Deploy: npm run deploy:dev | npm run deploy:prod (AWS_PROFILE=tgh-ryan, via direnv)
org: thegoldenhurricast
# The Serverless Dashboard only lists services that set both `org` and `app`.
app: hurricast-api
service: hurricast-api
# v4 auto-updates within this range.
frameworkVersion: '~4.43.0'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: us-east-2
  stage: ${opt:stage, 'dev'}
  # No aliases or provisioned concurrency, so don't keep a version per deploy.
  versionFunctions: false
  memorySize: 512
  timeout: 15
  logRetentionInDays: 90
  logs:
    lambda:
      logFormat: JSON
      applicationLogLevel: INFO
      systemLogLevel: WARN
    httpApi: true
  stackTags:
    project: thegoldenhurricast
  environment:
    STAGE: ${sls:stage}
    TABLE_NAME: ${self:custom.tableName}
    STRIPE_SECRET_KEY_PARAM: /hurricast/${sls:stage}/stripe-secret-key
    STRIPE_WEBHOOK_SECRET_PARAM: /hurricast/${sls:stage}/stripe-webhook-secret
    SITE_API_KEY_PARAM: /hurricast/${sls:stage}/site-api-key
  httpApi:
    # Called server-to-server by the website, never from browsers: no CORS.
    shouldStartNameWithService: true
  iam:
    role:
      # Each function gets its own role with only the permissions below it.
      mode: perFunction

stages:
  prod:
    params:
      allowedOrigins: https://www.thegoldenhurricast.com
      allowedOriginPattern: ''
      # The site whose cached merch pages are purged when stock or listings change.
      siteUrl: https://www.thegoldenhurricast.com
  dev:
    params:
      allowedOrigins: http://localhost:5173,http://localhost:4173
      # Netlify deploy previews and branch deploys.
      allowedOriginPattern: '^https://[a-z0-9-]+--thegoldenhurricast\.netlify\.app$'
      # Nothing to purge: localhost has no CDN, and deploy previews fall back to the merch
      # page's short CDN lifetime.
      siteUrl: ''

custom:
  tableName: hurricast-${sls:stage}
  # Reusable least-privilege IAM statements.
  iam:
    stripeKey:
      Effect: Allow
      Action: ssm:GetParameters
      Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hurricast/${sls:stage}/stripe-secret-key
    siteKey:
      Effect: Allow
      Action: ssm:GetParameters
      Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hurricast/${sls:stage}/site-api-key
    listingWrite:
      Effect: Allow
      Action: dynamodb:UpdateItem
      Resource: !GetAtt Table.Arn
    orderReadWrite:
      Effect: Allow
      Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
      Resource: !GetAtt Table.Arn

# Each function gets its own bundle, so the small ones don't ship Stripe.
package:
  individually: true

build:
  esbuild:
    sourcemap:
      type: linked
      setNodeOptions: true
    format: esm
    outExtension:
      .js: .mjs

functions:
  products:
    handler: src/handlers/products.handler
    events:
      - httpApi: GET /products
    iam:
      role:
        statements:
          - ${self:custom.iam.siteKey}
          - Effect: Allow
            Action: dynamodb:Query
            Resource: !GetAtt Table.Arn

  checkout:
    handler: src/handlers/checkout.handler
    environment:
      ALLOWED_ORIGINS: ${param:allowedOrigins}
      ALLOWED_ORIGIN_PATTERN: ${param:allowedOriginPattern}
    # Just under HTTP API's 30-second limit, so a Checkout Session create that exhausts its
    # Stripe retries (src/merch/stripe.ts) still leaves time to release the reservation.
    timeout: 29
    events:
      - httpApi: POST /checkout
    iam:
      role:
        statements:
          - ${self:custom.iam.siteKey}
          - ${self:custom.iam.stripeKey}
          - Effect: Allow
            Action:
              [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
            Resource: !GetAtt Table.Arn

  checkoutSession:
    handler: src/handlers/checkout-session.handler
    events:
      - httpApi: GET /checkout/sessions/{sessionId}
    iam:
      role:
        statements:
          - ${self:custom.iam.siteKey}
          - ${self:custom.iam.stripeKey}
          - ${self:custom.iam.orderReadWrite}

  cancelCheckout:
    handler: src/handlers/cancel-checkout.handler
    events:
      - httpApi: POST /checkout/{orderId}/cancel
    iam:
      role:
        statements:
          - ${self:custom.iam.siteKey}
          - ${self:custom.iam.stripeKey}
          - ${self:custom.iam.orderReadWrite}

  stripeWebhook:
    handler: src/handlers/stripe-webhook.handler
    events:
      - httpApi: POST /stripe/webhook
    iam:
      role:
        statements:
          - ${self:custom.iam.stripeKey}
          - ${self:custom.iam.orderReadWrite}
          - ${self:custom.iam.listingWrite}
          - Effect: Allow
            Action: ssm:GetParameters
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hurricast/${sls:stage}/stripe-webhook-secret

  questions:
    handler: src/handlers/questions.handler
    events:
      - httpApi: POST /questions
    iam:
      role:
        statements:
          - ${self:custom.iam.siteKey}
          - Effect: Allow
            Action: [dynamodb:PutItem, dynamodb:UpdateItem]
            Resource: !GetAtt Table.Arn

  sweep:
    handler: src/handlers/sweep.handler
    timeout: 120
    events:
      - schedule: rate(10 minutes)
    iam:
      role:
        statements:
          - ${self:custom.iam.stripeKey}
          - ${self:custom.iam.orderReadWrite}
          - Effect: Allow
            Action: dynamodb:Query
            Resource: !Sub '${Table.Arn}/index/GSI1'

  # The safety net behind the product webhooks. The deploy scripts also run it after deploying.
  syncCatalog:
    handler: src/handlers/sync-catalog.handler
    timeout: 60
    events:
      - schedule: rate(1 hour)
    iam:
      role:
        statements:
          - ${self:custom.iam.stripeKey}
          - ${self:custom.iam.listingWrite}
          - Effect: Allow
            Action: dynamodb:Query
            Resource: !GetAtt Table.Arn

  notify:
    handler: src/handlers/notify.handler
    # A batch stops at its first failure, but give slow Slack responses (10s each) room.
    timeout: 60
    environment:
      SLACK_QUESTIONS_WEBHOOK_URL_PARAM: /hurricast/${sls:stage}/slack-webhook-url
      SLACK_ORDERS_WEBHOOK_URL_PARAM: /hurricast/${sls:stage}/slack-orders-webhook-url
    iam:
      role:
        statements:
          - Effect: Allow
            Action: ssm:GetParameters
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hurricast/${sls:stage}/slack-webhook-url
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hurricast/${sls:stage}/slack-orders-webhook-url
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt Table.StreamArn
          startingPosition: LATEST
          batchSize: 10
          maximumRetryAttempts: 5
          maximumRecordAgeInSeconds: 86400
          bisectBatchOnFunctionError: true
          functionResponseType: ReportBatchItemFailures
          filterPatterns:
            - eventName: [INSERT]
              dynamodb:
                NewImage:
                  Type:
                    S: [Question]
            - eventName: [MODIFY]
              dynamodb:
                NewImage:
                  Type:
                    S: [Order]
                  Status:
                    S: [PAID]
                OldImage:
                  Status:
                    S: [{ anything-but: [PAID] }]

  # The table stream's second (and last unthrottled) consumer, after notify.
  purgeSiteCache:
    handler: src/handlers/purge-site-cache.handler
    environment:
      SITE_URL: ${param:siteUrl}
    iam:
      role:
        statements:
          - ${self:custom.iam.siteKey}
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt Table.StreamArn
          startingPosition: LATEST
          batchSize: 100
          # Wait a few seconds before purging, so a page render that read the old stock just
          # before the change is already stored, and gets purged too. Changes close together
          # then share one purge.
          batchWindow: 5
          # A purge is idempotent and one covers a whole batch, so retry the batch as a unit,
          # and give up on changes old enough that the CDN copy has expired anyway.
          maximumRetryAttempts: 10
          maximumRecordAgeInSeconds: 3600
          filterPatterns:
            # Inventory items; REMOVE records have no NewImage, but every record has Keys.
            - dynamodb:
                Keys:
                  PK:
                    S: [INVENTORY]

resources:
  Resources:
    Table:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: PK, AttributeType: S }
          - { AttributeName: SK, AttributeType: S }
          - { AttributeName: GSI1PK, AttributeType: S }
          - { AttributeName: GSI1SK, AttributeType: S }
          - { AttributeName: GSI2PK, AttributeType: S }
          - { AttributeName: GSI2SK, AttributeType: S }
        KeySchema:
          - { AttributeName: PK, KeyType: HASH }
          - { AttributeName: SK, KeyType: RANGE }
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - { AttributeName: GSI1PK, KeyType: HASH }
              - { AttributeName: GSI1SK, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
          - IndexName: GSI2
            KeySchema:
              - { AttributeName: GSI2PK, KeyType: HASH }
              - { AttributeName: GSI2SK, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
        TimeToLiveSpecification:
          AttributeName: ExpiresAt
          Enabled: true
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        DeletionProtectionEnabled: true
        SSESpecification:
          SSEEnabled: true

    # Monitoring is prod-only: dev's traffic is just testing, and its alarms would only be noise.
    # The address lives in SSM so this public repo never contains it.
    AlertsTopic:
      Type: AWS::SNS::Topic
      Condition: IsProd
      Properties:
        TopicName: hurricast-alerts
        Subscription:
          - Protocol: email
            Endpoint: ${ssm:/hurricast/alert-email}

    # A Lambda that throws or times out, or a broken deploy.
    ApiErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: hurricast-api-errors
        AlarmDescription: >-
          The Hurricast API returned 2 or more server errors within 5 minutes, so the store or
          the questions form may be failing. Check the /aws/lambda/hurricast-api-prod-* log groups.
        Namespace: AWS/ApiGateway
        MetricName: 5xx
        Dimensions:
          - { Name: ApiId, Value: !Ref HttpApi }
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Threshold: 2
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlertsTopic]
        OKActions: [!Ref AlertsTopic]

    # Covers what the API alarm cannot see: the Stripe webhook's retries, the sweep, the
    # catalog sync, the Slack notifier and the site cache purger, none of which answer a browser.
    FunctionErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: hurricast-function-errors
        AlarmDescription: >-
          A Hurricast function failed in the last 5 minutes. A failing stripeWebhook means paid
          orders aren't being recorded; a failing notify means Slack isn't hearing about them;
          a failing syncCatalog or purgeSiteCache means the merch page may show old listings or stock.
          Check the /aws/lambda/hurricast-api-prod-* log groups.
        Metrics:
          - Id: products
            ReturnData: false
            MetricStat:
              Period: 300
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - { Name: FunctionName, Value: !Ref ProductsLambdaFunction }
          - Id: checkout
            ReturnData: false
            MetricStat:
              Period: 300
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - { Name: FunctionName, Value: !Ref CheckoutLambdaFunction }
          - Id: session
            ReturnData: false
            MetricStat:
              Period: 300
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - { Name: FunctionName, Value: !Ref CheckoutSessionLambdaFunction }
          - Id: cancel
            ReturnData: false
            MetricStat:
              Period: 300
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - { Name: FunctionName, Value: !Ref CancelCheckoutLambdaFunction }
          - Id: webhook
            ReturnData: false
            MetricStat:
              Period: 300
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - { Name: FunctionName, Value: !Ref StripeWebhookLambdaFunction }
          - Id: questions
            ReturnData: false
            MetricStat:
              Period: 300
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - { Name: FunctionName, Value: !Ref QuestionsLambdaFunction }
          - Id: sweep
            ReturnData: false
            MetricStat:
              Period: 300
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - { Name: FunctionName, Value: !Ref SweepLambdaFunction }
          - Id: notify
            ReturnData: false
            MetricStat:
              Period: 300
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - { Name: FunctionName, Value: !Ref NotifyLambdaFunction }
          - Id: sync
            ReturnData: false
            MetricStat:
              Period: 300
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - { Name: FunctionName, Value: !Ref SyncCatalogLambdaFunction }
          - Id: purge
            ReturnData: false
            MetricStat:
              Period: 300
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - { Name: FunctionName, Value: !Ref PurgeSiteCacheLambdaFunction }
          - Id: errors
            Label: Errors across all functions
            Expression: FILL(products, 0) + FILL(checkout, 0) + FILL(session, 0) + FILL(cancel, 0) + FILL(webhook, 0) + FILL(questions, 0) + FILL(sweep, 0) + FILL(notify, 0) + FILL(sync, 0) + FILL(purge, 0)
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Threshold: 1
        EvaluationPeriods: 1
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlertsTopic]
        OKActions: [!Ref AlertsTopic]

    # The sweep runs every 10 minutes; half an hour without a successful run means the schedule
    # stopped or every run is failing, and abandoned checkouts are no longer being released.
    SweepMissedAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: IsProd
      Properties:
        AlarmName: hurricast-sweep-missed
        AlarmDescription: No sweep has succeeded in the last 30 minutes.
        Metrics:
          - Id: runs
            ReturnData: false
            MetricStat:
              Period: 1800
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Invocations
                Dimensions:
                  - { Name: FunctionName, Value: !Ref SweepLambdaFunction }
          - Id: failed
            ReturnData: false
            MetricStat:
              Period: 1800
              Stat: Sum
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - { Name: FunctionName, Value: !Ref SweepLambdaFunction }
          - Id: succeeded
            Label: Successful sweeps
            Expression: FILL(runs, 0) - FILL(failed, 0)
        ComparisonOperator: LessThanThreshold
        Threshold: 1
        EvaluationPeriods: 1
        TreatMissingData: breaching
        AlarmActions: [!Ref AlertsTopic]
        OKActions: [!Ref AlertsTopic]

    # One page for "is the store healthy?". CloudWatch > Dashboards > hurricast.
    Dashboard:
      Type: AWS::CloudWatch::Dashboard
      Condition: IsProd
      Properties:
        DashboardName: hurricast
        DashboardBody: !Sub |
          {
            "start": "-PT24H",
            "widgets": [
              {
                "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
                "properties": {
                  "markdown": "## The Golden Hurricast (prod)\nThe API the website calls for the merch store and the questions form, plus the background jobs: the 10-minute sweep that releases abandoned checkouts, the hourly catalog sync from Stripe, the notifier that posts questions and paid orders to Slack, and the purger that refreshes the site's cached merch page when stock changes. The alarms below email you when they trip."
                }
              },
              {
                "type": "alarm", "x": 0, "y": 2, "width": 24, "height": 3,
                "properties": {
                  "title": "Alarms",
                  "alarms": ["${ApiErrorsAlarm.Arn}", "${FunctionErrorsAlarm.Arn}", "${SweepMissedAlarm.Arn}"]
                }
              },
              {
                "type": "metric", "x": 0, "y": 5, "width": 8, "height": 6,
                "properties": {
                  "title": "API requests (per 5 minutes)",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                  "metrics": [
                    ["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", { "label": "Requests" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 8, "y": 5, "width": 8, "height": 6,
                "properties": {
                  "title": "Successful vs failed requests",
                  "region": "${AWS::Region}", "view": "timeSeries", "stacked": true, "stat": "Sum", "period": 300,
                  "metrics": [
                    ["AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", { "id": "count", "visible": false }],
                    ["AWS/ApiGateway", "4xx", "ApiId", "${HttpApi}", { "id": "c4", "visible": false }],
                    ["AWS/ApiGateway", "5xx", "ApiId", "${HttpApi}", { "id": "c5", "visible": false }],
                    [{ "expression": "FILL(c5, 0)", "label": "Server errors (5xx)", "id": "server", "color": "#d62728" }],
                    [{ "expression": "FILL(c4, 0)", "label": "Rejected (4xx, e.g. missing site key)", "id": "client", "color": "#ff7f0e" }],
                    [{ "expression": "FILL(count, 0) - FILL(c4, 0) - FILL(c5, 0)", "label": "Successful", "id": "ok", "color": "#2ca02c" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 16, "y": 5, "width": 8, "height": 6,
                "properties": {
                  "title": "API response time (ms)",
                  "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                  "metrics": [
                    ["AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", { "stat": "p50", "label": "Typical (p50)" }],
                    ["AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", { "stat": "p95", "label": "Slowest 5% (p95)" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 11, "width": 16, "height": 6,
                "properties": {
                  "title": "Requests by endpoint (per 5 minutes)",
                  "region": "${AWS::Region}", "view": "timeSeries", "stacked": true, "stat": "Sum", "period": 300,
                  "metrics": [
                    ["AWS/Lambda", "Invocations", "FunctionName", "${ProductsLambdaFunction}", { "label": "GET /products" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${CheckoutLambdaFunction}", { "label": "POST /checkout" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${CheckoutSessionLambdaFunction}", { "label": "GET /checkout/sessions/{sessionId}" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${CancelCheckoutLambdaFunction}", { "label": "POST /checkout/{orderId}/cancel" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${QuestionsLambdaFunction}", { "label": "POST /questions" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${StripeWebhookLambdaFunction}", { "label": "POST /stripe/webhook (from Stripe)" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 16, "y": 11, "width": 8, "height": 6,
                "properties": {
                  "title": "Busiest endpoints (whole time range)",
                  "region": "${AWS::Region}", "view": "bar", "stat": "Sum", "period": 300, "setPeriodToTimeRange": true,
                  "metrics": [
                    ["AWS/Lambda", "Invocations", "FunctionName", "${ProductsLambdaFunction}", { "label": "GET /products" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${CheckoutLambdaFunction}", { "label": "POST /checkout" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${CheckoutSessionLambdaFunction}", { "label": "GET /checkout/sessions/{sessionId}" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${CancelCheckoutLambdaFunction}", { "label": "POST /checkout/{orderId}/cancel" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${QuestionsLambdaFunction}", { "label": "POST /questions" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${StripeWebhookLambdaFunction}", { "label": "POST /stripe/webhook (from Stripe)" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 17, "width": 12, "height": 6,
                "properties": {
                  "title": "Store: checkouts and Stripe webhooks",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                  "metrics": [
                    ["AWS/Lambda", "Invocations", "FunctionName", "${CheckoutLambdaFunction}", { "label": "Checkouts started" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${StripeWebhookLambdaFunction}", { "label": "Stripe webhooks received" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${CancelCheckoutLambdaFunction}", { "label": "Checkouts cancelled" }],
                    ["AWS/Lambda", "Errors", "FunctionName", "${CheckoutLambdaFunction}", { "label": "Checkout errors", "color": "#d62728" }],
                    ["AWS/Lambda", "Errors", "FunctionName", "${StripeWebhookLambdaFunction}", { "label": "Webhook errors", "color": "#9467bd" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 17, "width": 12, "height": 6,
                "properties": {
                  "title": "Background jobs",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 1800,
                  "metrics": [
                    ["AWS/Lambda", "Invocations", "FunctionName", "${SweepLambdaFunction}", { "label": "Sweep runs (3 per 30 min expected)" }],
                    ["AWS/Lambda", "Errors", "FunctionName", "${SweepLambdaFunction}", { "label": "Sweep errors", "color": "#d62728" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${NotifyLambdaFunction}", { "label": "Slack notifications sent" }],
                    ["AWS/Lambda", "Errors", "FunctionName", "${NotifyLambdaFunction}", { "label": "Notifier errors", "color": "#9467bd" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${SyncCatalogLambdaFunction}", { "label": "Catalog syncs (1 per hour expected)" }],
                    ["AWS/Lambda", "Errors", "FunctionName", "${SyncCatalogLambdaFunction}", { "label": "Catalog sync errors", "color": "#8c564b" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${PurgeSiteCacheLambdaFunction}", { "label": "Purger runs (stock or listing changes)" }],
                    ["AWS/Lambda", "Errors", "FunctionName", "${PurgeSiteCacheLambdaFunction}", { "label": "Purge errors", "color": "#e377c2" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 23, "width": 12, "height": 6,
                "properties": {
                  "title": "Errors by function",
                  "region": "${AWS::Region}", "view": "timeSeries", "stacked": true, "period": 300,
                  "metrics": [
                    [{ "expression": "SEARCH('{AWS/Lambda,FunctionName} MetricName=\"Errors\" \"${self:service}-${sls:stage}\"', 'Sum', 300)", "id": "errors" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 23, "width": 12, "height": 6,
                "properties": {
                  "title": "Database: reads, writes and throttling",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                  "metrics": [
                    ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${Table}", { "label": "Read units" }],
                    ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${Table}", { "label": "Write units" }],
                    ["AWS/DynamoDB", "ReadThrottleEvents", "TableName", "${Table}", { "label": "Throttled reads", "color": "#d62728", "yAxis": "right" }],
                    ["AWS/DynamoDB", "WriteThrottleEvents", "TableName", "${Table}", { "label": "Throttled writes", "color": "#9467bd", "yAxis": "right" }]
                  ]
                }
              }
            ]
          }

  Conditions:
    IsProd: !Equals ['${sls:stage}', 'prod']

  extensions:
    # Rate-limit the public API (requests/second across all routes).
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
