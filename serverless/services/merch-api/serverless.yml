# org and app for use with dashboard.serverless.com
org: thegoldenhurricast
app: merch-api
service: merch-api

# You can pin your service to only deploy with a specific Serverless version
# Check out our docs for more details
useDotenv: true

provider:
  name: aws
  runtime: nodejs24.x
  stage: dev
  region: us-east-2
  profile: tgh-ryan
  environment:
    STAGE: ${opt:stage, self:provider.stage}
    ORDERS_TABLE: ${param:ordersTable}
  
  httpApi:
    shouldStartNameWithService: true
    cors:
      allowedOrigins: ${param:corsOrigins} # stage-specific; see params below
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
      allowCredentials: true
      exposedResponseHeaders:
        - Special-Response-Header
      maxAge: 6000 # seconds
      
  iam:
    role:
      statements:
        - Effect: 'Allow'
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Scan
          Resource:
            - Fn::GetAtt: [ OrdersTable, Arn ]
  
params:
  default:
    # Prod-safe origins. Used by every stage unless overridden below.
    corsOrigins:
      - https://thegoldenhurricast.com
      - https://www.thegoldenhurricast.com
  prod:
    ordersTable: Orders
  dev:
    ordersTable: Orders-dev
    # Local Gatsby dev only talks to the dev backend.
    corsOrigins:
      - http://localhost:8000 # gatsby develop
      - http://localhost:9000 # gatsby serve

functions:
  calculateRemainingItems:
    handler: handler.calculateRemainingItems
    events:
      - httpApi:
          method: GET
          path: /products/calculateRemainingItems
    
  addOrderToTable:
    handler: handler.addOrderToTable
    events:
      - httpApi:
          method: POST
          path: /orders/new/{productId}/{orderId}/{quantity}
  
package:
  individually: true
  excludeDevDependencies: true
  patterns:
    - '../../shared/**'
  
plugins:
  - serverless-plugin-common-excludes
  
resources:
  Resources:
    OrdersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${param:ordersTable}
        AttributeDefinitions:
          - AttributeName: productId
            AttributeType: S
          - AttributeName: orderId
            AttributeType: S
        KeySchema:
          - AttributeName: productId
            KeyType: HASH
          - AttributeName: orderId
            KeyType: RANGE
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        BillingMode: PAY_PER_REQUEST
